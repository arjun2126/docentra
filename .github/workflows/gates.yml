name: gates

# The same script agents run locally. A check that passes for an agent and fails
# here (or vice versa) is therefore impossible by construction.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run gates
        run: bash scripts/gates.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-evidence
          path: |
            tasks/evidence/
            journal/
          if-no-files-found: ignore
